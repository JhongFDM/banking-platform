risk-score:
  version: 1.0
  insufficientConditions:
    minMonths: 3
  riskScoreBands:
    - { max: 25, level: LOW, explain: "healthy financial position" }
    - { max: 45, level: MODERATE, explain: "generally stable with minor concerns" }
    - { max: 70, level: ELEVATED, explain: "financial strain, needs attention" }
    - { max: 100, level: HIGH, explain: "high risk, immediate action recommended" }

  factors:
    SPENDING_INCOME_RATIO:
      weight: 0.5
      bands:
        - { max: 0.5, score: 10, meaning: healthy }
        - { max: 0.7, score: 20, meaning: comfortable }
        - { max: 0.9, score: 35, meaning: tight }
        - { max: 1.0, score: 60, meaning: danger }
        - { max: 9999, score: 100, meaning: spending more than earning }
    # months of spend convered
    SAVING_BALANCE:
      weight: 0.35
      bands:
        - { max: 0.25, score: 100, meaning: no buffer }
        - { max: 1, score: 90, meaning: very thin }
        - { max: 3, score: 60, meaning: thin }
        - { max: 6, score: 20, meaning: adequate }
        - { max: 9999, score: 10, meaning: strong }
    # Saving goals:
    GOAL_PROGRESS:
      weight: 0.15
      bands:
        - { max: 10, score: 100, meaning: barely started }
        - { max: 30, score: 80, meaning: early }
        - { max: 60, score: 50, meaning: on track }
        - { max: 90, score: 25, meaning: nearly there }
        - { max: 99.9, score: 15, meaning: almost there }
        - { max: 100, score: 10, meaning: goal met }
