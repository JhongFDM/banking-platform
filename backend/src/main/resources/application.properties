# Loads backend/.env (gitignored) as extra config properties, if present.
# Native Spring Boot mechanism -- not a third-party library -- so it can't
# silently fail to be picked up on the classpath the way spring-dotenv did.
spring.config.import=optional:file:.env[.properties]

spring.application.name=digital-banking-platform-backend
server.port=8080
 
#spring.datasource.url=jdbc:h2:mem:digitalbankdb
spring.datasource.url=jdbc:h2:file:./data/digitalbankdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
 
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyForHs256JwtTokenMinimum32Chars}
jwt.access-token-expiry=3600
jwt.refresh-token-expiry=604800
 
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
 
# Logging
logging.file.name=logs/digital-banking.log
logging.level.root=INFO
logging.level.com.group1.banking=INFO
logging.level.org.springframework.security=INFO

server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# Savings Insight Chatbot
# ---------------------------------------------------------------------------
# template = deterministic, no external calls (safe default for QA/demo).
# groq     = real LLM generation via Groq's chat-completions API.
chatbot.generator=groq

# Demo-safe traceability toggle -- set to false to disable persisting
# chat_message rows entirely (e.g. a real production profile).
chatbot.persistence.enabled=true

# Never hardcode a real key here -- GROQ_API_KEY comes from backend/.env
# (gitignored) or a real environment variable.
groq.api.key=${GROQ_API_KEY:}
groq.api.base-url=https://api.groq.com/openai/v1
# openai/gpt-oss-120b: llama-3.3-70b-versatile is deprecated by Groq
# (shutdown 08/16/26) -- check https://console.groq.com/docs/deprecations
# before assuming this default is still current.
groq.api.model=openai/gpt-oss-120b
groq.api.temperature=0.2
groq.api.max-tokens=300
groq.api.timeout-ms=8000

# Separate Postgres+pgvector instance -- stores ONLY the chatbot's knowledge
# embeddings, nothing else in the app touches it. Blank URL = feature
# degrades gracefully (no cited tips, no crash). See docker-compose.pgvector.yml.
pgvector.datasource.url=${PGVECTOR_URL:}
pgvector.datasource.username=${PGVECTOR_USERNAME:}
pgvector.datasource.password=${PGVECTOR_PASSWORD:}
pgvector.api.timeout-ms=8000
pgvector.top-k=2
pgvector.indexing.on-startup=true