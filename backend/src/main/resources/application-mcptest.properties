# Opt-in profile: activate with --spring.profiles.active=mcptest (or an IDE run
# config) to point the MCP client at the local mcp-test-server/ module, proving the
# client can reach and call a real MCP server.
#
# mcp-test-server must already be running on port 8081 BEFORE this app starts: the
# MCP client connects eagerly at startup, so an unreachable server here can prevent
# this app from starting - the same way the pgvector datasource does. That's exactly
# why this lives in its own profile instead of the default application.properties:
# the base configuration (0 servers) stays safe to start under any circumstances.
#
# This does not change chatbot behavior even when active - the ping tool this
# exposes is not wired into ChatbotAiConfig's ChatClient, so nothing calls it.
spring.ai.mcp.client.sse.connections.test-server.url=http://localhost:8081
