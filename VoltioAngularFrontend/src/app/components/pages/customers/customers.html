<div class="admin-container">
  <section class="card filter-card">
    <div class="card-header-title-wrapper">
      <h2>Customers</h2>
      <p class="subtitle">All customers in the system.</p>
    </div>

    <div class="filter-group filters-row">
      <input 
        type="text" 
        placeholder="Search by name or ID..." 
        [ngModel]="searchQuery()" 
        (ngModelChange)="searchQuery.set($event)" 
      />
    </div>
  </section>

  <section class="card table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Name</th>
          <th>Type</th>
          <th>Total Accounts</th>
          <th>Member Since</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of filteredCustomers(); track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td class="font-bold">{{ item.name }}</td>
            <td class="badge-type">{{ item.type }}</td>
            <td>{{ item.totalAccounts }}</td>
            <td class="text-muted-cell">{{ item.memberSince }}</td>
            <td class="text-right">
              <app-button 
                type="primary" 
                label="Manage" 
                (click)="manageCustomer(item)">
              </app-button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="empty-state">No customers found.</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
