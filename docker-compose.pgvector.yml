services:
  chatbot-pgvector:
    image: pgvector/pgvector:pg16
    container_name: chatbot-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Intentionally non-default (5433), to avoid colliding with any
      # Postgres you already have running locally.
      - "5433:5432"
    volumes:
      - chatbot_pgvector_data:/var/lib/postgresql/data

volumes:
  chatbot_pgvector_data:
