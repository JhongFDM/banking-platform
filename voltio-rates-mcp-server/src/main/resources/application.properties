spring.application.name=mcp-test-server
server.port=8081

# Identity this server presents to MCP clients during the initialize handshake.
spring.ai.mcp.server.name=voltio-mcp-test-server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Test-only MCP server exposing a single ping tool, used to verify the banking-platform backend's MCP client can connect to a real server.

# Verbose logging while proving the connection out - trim once it's working.
logging.level.com.voltio.mcptestserver=INFO
logging.level.io.modelcontextprotocol=DEBUG
