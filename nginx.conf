server {
    listen 8080;

    # Frontend code calls both /api/... and direct service paths like /customers/... and /accounts/...
    # Keep both working to avoid environment-specific route breakage.
    #
    # A hard refresh or direct URL entry on a client-side route (e.g.
    # /accounts/1003) sends a real browser navigation to this exact path,
    # which also matches this proxy rule. Without the Accept check below,
    # that navigation hits the backend directly instead of the SPA shell,
    # and since the JWT is only ever attached by the frontend's own JS (see
    # src/api/axiosClient.js), the backend sees no auth header and returns
    # a raw 401 the browser renders as-is. Browser navigations request
    # `Accept: text/html`; this app's own API calls don't - route those to
    # the SPA shell instead of the backend.
    location ~ ^/(accounts|customers|standing-orders)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /spa-shell last;
        }

        proxy_pass https://digital-banking-service-524103119199.northamerica-northeast1.run.app;
        proxy_set_header Host digital-banking-service-524103119199.northamerica-northeast1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location = /spa-shell {
        internal;
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://digital-banking-service-524103119199.northamerica-northeast1.run.app;
        proxy_set_header Host digital-banking-service-524103119199.northamerica-northeast1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}
